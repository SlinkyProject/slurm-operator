---
suite: test webhook rbac
templates:
  - webhook/rbac.yaml
chart:
  version: 1.2.3
  appVersion: 1.2.3
release:
  name: test-release
  namespace: test-namespace
tests:
  - it: manifest should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: should not render when disabled
    set:
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should not render when serviceAccount.create is false
    set:
      webhook:
        serviceAccount:
          create: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should set namespace
    documentSelector:
      path: kind
      value: ServiceAccount
    set:
      namespaceOverride: custom-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-namespace
  - it: should set serviceAccount name
    documentSelector:
      path: kind
      value: ServiceAccount
    set:
      webhook:
        serviceAccount:
          name: custom-service-account
    asserts:
      - equal:
          path: metadata.name
          value: custom-service-account
  - it: should scope cluster-scoped names to the release
    set:
      webhook:
        serviceAccount:
          name: custom-service-account
    asserts:
      - equal:
          path: metadata.name
          value: test-release-slurm-operator-webhook
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: metadata.name
          value: test-release-slurm-operator-webhook
        documentSelector:
          path: kind
          value: ClusterRoleBinding
  - it: should bind to the webhook ClusterRole, not the serviceAccount name
    documentSelector:
      path: kind
      value: ClusterRoleBinding
    set:
      webhook:
        serviceAccount:
          name: custom-service-account
    asserts:
      - equal:
          path: roleRef.name
          value: test-release-slurm-operator-webhook
      - equal:
          path: subjects[0].name
          value: custom-service-account
      - equal:
          path: subjects[0].namespace
          value: test-namespace
