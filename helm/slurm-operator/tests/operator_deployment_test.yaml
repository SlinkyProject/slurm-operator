---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test operator deployment
templates:
  - operator/deployment.yaml
chart:
  version: 1.2.3
  appVersion: 1.2.3
release:
  name: test-release
  namespace: test-namespace
tests:
  - it: manifest should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: should add affinity
    set:
      operator:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: arch
                      operator: In
                      values:
                        - x86_64
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: x86_64
  - it: should add tolerations
    set:
      operator:
        tolerations:
          - key: test
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 6000
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: test
  - it: should set imagePullSecrets
    set:
      imagePullSecrets:
        - name: test-docker-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: test-docker-secret
  - it: should set priorityClassName
    set:
      priorityClassName: test-priority-class
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: test-priority-class
  - it: should set replica count
    set:
      operator:
        replicas: 42
    asserts:
      - equal:
          path: spec.replicas
          value: 42
  - it: should set namespace
    set:
      namespaceOverride: custom-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-namespace
  - it: should set name
    set:
      nameOverride: custom-name
    asserts:
      - equal:
          path: metadata.name
          value: custom-name
  - it: should set serviceAccount
    set:
      operator:
        serviceAccount:
          name: custom-service-account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-service-account
  - it: should add resources
    set:
      operator:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            cpu: "500m"
            memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "100m"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "500m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
  - it: should not pass --metrics-secure by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --metrics-secure
  - it: should pass --metrics-secure when metricsSecure is enabled
    set:
      operator:
        metricsPort: 8080
        metricsSecure: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-secure
  - it: should fail when metricsSecure is enabled without a metrics port
    set:
      operator:
        metricsPort: 0
        metricsSecure: true
    asserts:
      - failedTemplate:
          errorPattern: operator.metricsSecure requires operator.metricsPort
  - it: should disable the metrics server when metricsPort is zero
    set:
      operator:
        metricsPort: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[18]
          value: --metrics-addr
      - equal:
          path: spec.template.spec.containers[0].args[19]
          value: "0"
  - it: should set the metrics address from metricsPort
    set:
      operator:
        metricsPort: 9090
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[18]
          value: --metrics-addr
      - equal:
          path: spec.template.spec.containers[0].args[19]
          value: :9090
  - it: should fail when metricsSecure is enabled with a string zero metrics port
    set:
      operator:
        metricsPort: "0"
        metricsSecure: true
    asserts:
      - failedTemplate:
          errorPattern: operator.metricsSecure requires operator.metricsPort
  - it: should fail when metricsPort is not a valid port
    set:
      operator:
        metricsPort: 8O80
    asserts:
      - failedTemplate:
          errorPattern: operator.metricsPort must be an integer between 0 and 65535
  - it: should fail when metricsPort has a leading zero
    set:
      operator:
        metricsPort: "08080"
    asserts:
      - failedTemplate:
          errorPattern: operator.metricsPort must be an integer between 0 and 65535
  - it: should fail when metricsPort is out of range
    set:
      operator:
        metricsPort: 70000
    asserts:
      - failedTemplate:
          errorPattern: operator.metricsPort must be an integer between 0 and 65535
  - it: should fail when metricsPort is a boolean
    set:
      operator:
        metricsPort: false
    asserts:
      - failedTemplate:
          errorPattern: operator.metricsPort must be an integer between 0 and 65535
  - it: should fail when metricsPort is an empty string
    set:
      operator:
        metricsPort: ""
    asserts:
      - failedTemplate:
          errorPattern: operator.metricsPort must be an integer between 0 and 65535
