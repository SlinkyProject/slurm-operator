---
suite: test webhook configuration
templates:
  - webhook/webhook.yaml
chart:
  version: 1.2.3
  appVersion: 1.2.3
release:
  name: test-release
  namespace: test-namespace
tests:
  - it: should not render when webhook is disabled
    set:
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: default manifest should match snapshot
    asserts:
      - matchSnapshot: {}

  - it: should generate pods/binding webhook when podsBinding is set to true
    set:
      webhook:
        podsBinding: true
    asserts:
      - matchSnapshot: {}

  - it: should honor overridden validating and mutating failurePolicy and matchPolicy values
    set:
      webhook:
        enabled: true
        podsBinding: true
        validating:
          failurePolicy: Ignore
          matchPolicy: Exact
        mutating:
          failurePolicy: Fail
          matchPolicy: Exact
      certManager:
        enabled: false
        secretName: slurm-operator-webhook-ca
    asserts:
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[*].failurePolicy
          value: Ignore
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[*].matchPolicy
          value: Exact
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[0].failurePolicy
          value: Fail
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[0].matchPolicy
          value: Exact

  - it: should honor overridden timeoutSeconds
    set:
      webhook:
        podsBinding: true
        timeoutSeconds: 30
    asserts:
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[*].timeoutSeconds
          value: 30
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[0].timeoutSeconds
          value: 30

  - it: should scope webhooks to configured namespaces
    set:
      webhook:
        podsBinding: true
    values:
      - values/webhook_namespaces.yaml
    asserts:
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[*].namespaceSelector.matchExpressions[0]
          value:
            key: kubernetes.io/metadata.name
            operator: In
            values:
              - slurm
              - compute
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[*].namespaceSelector.matchExpressions[1]
          value:
            key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - kube-system
              - kube-node-lease
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0]
          value:
            key: kubernetes.io/metadata.name
            operator: In
            values:
              - slurm
              - compute
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[0].namespaceSelector.matchExpressions[1]
          value:
            key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - kube-system
              - kube-node-lease
              - test-namespace

  - it: should render the validating namespaceSelector override verbatim and leave the binding webhook scoped
    set:
      webhook:
        podsBinding: true
    values:
      - values/webhook_namespaceselector.yaml
    asserts:
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[*].namespaceSelector
          value:
            matchLabels:
              kubernetes.io/metadata.name: slurm
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[0].namespaceSelector
          value:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  - kube-system
                  - kube-node-lease
                  - test-namespace

  - it: should keep the binding webhook scoped via webhook.namespaces when a validating override is set
    set:
      webhook:
        podsBinding: true
        namespaces: slurm,compute
        validating:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: slurm
    asserts:
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[*].namespaceSelector
          value:
            matchLabels:
              kubernetes.io/metadata.name: slurm
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[0].namespaceSelector
          value:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - slurm
                  - compute
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  - kube-system
                  - kube-node-lease
                  - test-namespace

  - it: should inject caBundle and render TLS secret when certManager is disabled
    set:
      webhook:
        podsBinding: true
      certManager:
        enabled: false
        secretName: slurm-operator-webhook-ca
    asserts:
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        exists:
          path: webhooks[0].clientConfig.caBundle
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        exists:
          path: webhooks[0].clientConfig.caBundle
      - documentSelector:
          path: kind
          value: Secret
        equal:
          path: type
          value: kubernetes.io/tls
      - documentSelector:
          path: kind
          value: Secret
        equal:
          path: metadata.name
          value: slurm-operator-webhook-ca
      - documentSelector:
          path: kind
          value: Secret
        exists:
          path: data["tls.crt"]
      - documentSelector:
          path: kind
          value: Secret
        exists:
          path: data["tls.key"]
      - documentSelector:
          path: kind
          value: Secret
        exists:
          path: data["ca.crt"]

  - it: should not render matchConditions when not set
    set:
      webhook:
        enabled: true
        podsBinding: true
      certManager:
        enabled: false
        secretName: slurm-operator-webhook-ca
    asserts:
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        notExists:
          path: webhooks[0].matchConditions
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        notExists:
          path: webhooks[0].matchConditions

  - it: should apply matchConditions to all validating webhooks when set
    set:
      webhook:
        enabled: true
        validating:
          matchConditions:
            - name: rbac
              expression: 'request.resource.group != "rbac.authorization.k8s.io"'
      certManager:
        enabled: false
        secretName: slurm-operator-webhook-ca
    asserts:
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[*].matchConditions
          value:
            - name: rbac
              expression: 'request.resource.group != "rbac.authorization.k8s.io"'

  - it: should apply matchConditions to all mutating webhooks when set
    set:
      webhook:
        enabled: true
        podsBinding: true
        mutating:
          matchConditions:
            - name: rbac
              expression: 'request.resource.group != "rbac.authorization.k8s.io"'
      certManager:
        enabled: false
        secretName: slurm-operator-webhook-ca
    asserts:
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[*].matchConditions
          value:
            - name: rbac
              expression: 'request.resource.group != "rbac.authorization.k8s.io"'

  - it: should include cert-manager annotations when certManager is enabled
    documentSelector:
      path: kind
      value: ValidatingWebhookConfiguration
    set:
      webhook:
        enabled: true
      certManager:
        enabled: true
        secretName: slurm-operator-webhook-ca
    asserts:
      - exists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]

  - it: should pass through validatingAnnotations
    documentSelector:
      path: kind
      value: ValidatingWebhookConfiguration
    set:
      webhook:
        enabled: true
        validatingAnnotations:
          cert-manager.io/inject-ca-from-secret: vault-pki/webhook-ca
          custom.example.com/owner: platform-team
      certManager:
        enabled: false
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: vault-pki/webhook-ca
      - equal:
          path: metadata.annotations["custom.example.com/owner"]
          value: platform-team

  - it: should pass through mutatingAnnotations
    documentSelector:
      path: kind
      value: MutatingWebhookConfiguration
    set:
      webhook:
        enabled: true
        podsBinding: true
        mutatingAnnotations:
          cert-manager.io/inject-ca-from-secret: vault-pki/webhook-ca
      certManager:
        enabled: false
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from-secret"]
          value: vault-pki/webhook-ca

  - it: should let user annotations override chart-managed cert-manager annotations
    documentSelector:
      path: kind
      value: ValidatingWebhookConfiguration
    set:
      webhook:
        enabled: true
        validatingAnnotations:
          cert-manager.io/inject-ca-from: custom-ns/custom-cert
      certManager:
        enabled: true
        secretName: slurm-operator-webhook-ca
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: custom-ns/custom-cert

  - it: should omit annotations block when there are none
    documentSelector:
      path: kind
      value: ValidatingWebhookConfiguration
    set:
      webhook:
        enabled: true
      certManager:
        enabled: false
    asserts:
      - notExists:
          path: metadata.annotations

  - it: should tolerate validatingAnnotations set to null
    documentSelector:
      path: kind
      value: ValidatingWebhookConfiguration
    set:
      webhook:
        enabled: true
        validatingAnnotations: null
      certManager:
        enabled: true
        secretName: slurm-operator-webhook-ca
    asserts:
      - exists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]

  - it: should tolerate mutatingAnnotations set to null
    documentSelector:
      path: kind
      value: MutatingWebhookConfiguration
    set:
      webhook:
        enabled: true
        podsBinding: true
        mutatingAnnotations: null
      certManager:
        enabled: true
        secretName: slurm-operator-webhook-ca
    asserts:
      - exists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]

  - it: should fail when both certManager and externalCertInjection are enabled
    set:
      webhook:
        enabled: true
      certManager:
        enabled: true
      externalCertInjection:
        enabled: true
        secretName: my-byo-cert
    asserts:
      - failedTemplate:
          errorPattern: mutually exclusive

  - it: should fail when externalCertInjection Secret is missing
    set:
      webhook:
        enabled: true
      certManager:
        enabled: false
      externalCertInjection:
        enabled: true
        secretName: my-byo-cert
    asserts:
      - failedTemplate:
          errorPattern: was not found

  - it: should fail when externalCertInjection.secretName is empty
    set:
      webhook:
        enabled: true
      certManager:
        enabled: false
      externalCertInjection:
        enabled: true
        secretName: ""
    asserts:
      - failedTemplate:
          errorPattern: externalCertInjection\.secretName is empty

  - it: should inline caBundle from external Secret when externalCertInjection is enabled
    documentSelector:
      path: kind
      value: ValidatingWebhookConfiguration
    set:
      webhook:
        enabled: true
      certManager:
        enabled: false
      externalCertInjection:
        enabled: true
        secretName: my-byo-cert
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: my-byo-cert
            namespace: test-namespace
          type: kubernetes.io/tls
          data:
            tls.crt: dGxzLWNydA== # "tls-crt"
            tls.key: dGxzLWtleQ== # "tls-key"
            ca.crt: Y2EtY3J0 # "ca-crt"
    asserts:
      - notExists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
      - equal:
          path: webhooks[0].clientConfig.caBundle
          value: Y2EtY3J0

  - it: should not render TLS secret when externalCertInjection is enabled
    documentIndex: 0
    set:
      webhook:
        enabled: true
      certManager:
        enabled: false
      externalCertInjection:
        enabled: true
        secretName: my-byo-cert
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: my-byo-cert
            namespace: test-namespace
          type: kubernetes.io/tls
          data:
            tls.crt: dGxzLWNydA==
            tls.key: dGxzLWtleQ==
            ca.crt: Y2EtY3J0
    asserts:
      - equal:
          path: kind
          value: ValidatingWebhookConfiguration

  - it: should fail when externalCertInjection Secret is not kubernetes.io/tls
    set:
      webhook:
        enabled: true
      certManager:
        enabled: false
      externalCertInjection:
        enabled: true
        secretName: my-byo-cert
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: my-byo-cert
            namespace: test-namespace
          type: Opaque
          data:
            tls.crt: dGxzLWNydA==
            tls.key: dGxzLWtleQ==
            ca.crt: Y2EtY3J0
    asserts:
      - failedTemplate:
          errorPattern: must be of type kubernetes\.io/tls

  - it: should fail when externalCertInjection Secret is missing tls.key
    set:
      webhook:
        enabled: true
      certManager:
        enabled: false
      externalCertInjection:
        enabled: true
        secretName: my-byo-cert
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: my-byo-cert
            namespace: test-namespace
          type: kubernetes.io/tls
          data:
            tls.crt: dGxzLWNydA==
            ca.crt: Y2EtY3J0
    asserts:
      - failedTemplate:
          errorPattern: is missing the "tls\.key" key
