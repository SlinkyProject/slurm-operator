apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - slurm-operator.yaml
configMapGenerator:
  - name: slurm-operator-grafana-dashboard
    files:
      - dashboards/controller-runtime.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: '1'
