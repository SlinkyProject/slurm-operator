---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-custom-ldif
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
data:
  00-root.ldif: |-
    dn: dc=alpha,dc=example
    objectClass: top
    objectClass: dcObject
    objectClass: organization
    dc: alpha
    o: Alpha example
  10-units.ldif: |-
    dn: ou=users,dc=alpha,dc=example
    objectClass: organizationalUnit
    ou: users

    dn: ou=groups,dc=alpha,dc=example
    objectClass: organizationalUnit
    ou: groups
  20-group.ldif: |-
    dn: cn=users,ou=groups,dc=alpha,dc=example
    objectClass: posixGroup
    cn: users
    gidNumber: 10000
    memberUid: alice
  30-user.ldif: |-
    dn: uid=alice,ou=users,dc=alpha,dc=example
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: alice
    cn: Alice Example
    sn: Example
    uidNumber: 10001
    gidNumber: 10000
    homeDirectory: /home/alice
    loginShell: /bin/bash
